; Обработка очереди (письма участникам). См. deploy/supervisor/README.md
; Пример для Linux-сервера (Ubuntu/Debian): /etc/supervisor/conf.d/email-queue.conf
;
; Копировать как: sudo cp deploy/supervisor/queue-worker.conf /etc/supervisor/conf.d/email-queue.conf
; Затем:          sudo supervisorctl reread && sudo supervisorctl update
; Убедиться, что воркер поднялся: sudo supervisorctl status

[program:email_queue]
; Важно: работаем только с основным демоном: --daemon НЕ нужен (supervisor сам держит процесс).
command=php /Users/pavelklimov/Herd/landing/artisan queue:work --queue=default,sendnewsletter --sleep=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Письма участникам — до 3 попыток, потом в failed_jobs
startretries=5
startsecs=3
stdout_logfile=/Users/pavelklimov/Herd/landing/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/Users/pavelklimov/Herd/landing/storage/logs/queue-worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=APP_ENV="production"
user=pavelklimov
